# 回测配置文件
# 支持通过命令行 --strategy, --start, --end 覆盖

# 选股策略名称（可选：trend_ma 等）
strategy: trend_ma

# 策略参数（trend_ma 策略专用）
strategy_params:
  pool_size: 3              # 每日持仓数量（取评分 top N）
  min_avg_amount_20: 50000000  # 20 日均成交额下限（元），过滤流动性不足
  min_bars: 160              # K 线最少条数（需覆盖 120MA + 缓冲）
  pullback_touch_tol: 0.02   # 回踩触及 MA20 容忍度（±2%）
  breakout_vol_ratio: 1.5    # 突破时量比下限
  max_close_over_ma20: 1.08  # 收盘相对 MA20 上限（8%），防追高
  min_rs20: 0.0              # 相对强度下限（相对基准 20 日收益）
  min_days_above_ma120: 30   # 过去 N 天收盘价均在 MA120 之上
  min_trend_days: 10         # MA20 > MA60 至少维持天数
  pullback_max_vol_ratio: 1.2  # 回踩时量比上限（缩量确认）
  min_score: 25.0            # 最低评分门槛，低于此分不入池
  pool_workers: 4            # 回测时并行评分进程数，0=不并行

# 选股宇宙（hs300 / zz500 / sz50 / zz1000 / zz2000）
universe: zz500
# 基准指数代码（用于计算相对强度）
benchmark: sh.000852
# 复权方式：1=后复权, 2=前复权, 3=不复权
adjustflag: "2"
# 是否包含北交所
allow_bj: false

# 回测起止日期（仅用本地已有 K 线，请先对该区间跑 supplement_kline 补全数据）
start_date: "2023-01-01"
end_date: "2023-03-31"  # 回测最后一天（收益统计到这一天）

# 选股时间段：只在此区间内每日重新选池，可设短一些以加快回测；不填则与上面起止一致
pool_screen_start: null  # 选股开始日，null=用 start_date
pool_screen_end: null    # 选股结束日，null=用 end_date。设短则选股结束后沿用最后一日池子直到 end_date

# 资金与仓位
initial_capital: 500000  # 初始资金（元），如 50 万
max_positions: 5        # 最多持仓只数

# 止盈止损（按当日 high/low 判断，触发则按该价格退出；不设或 null 表示不启用）
stop_loss_pct: -5   # 止损点数，如 -5 表示 -5%
take_profit_pct: 20 # 止盈点数，如 20 表示 20%
break_ma20_pct: 2   # 破20天线 N 个点卖出，如 2 表示跌破 MA20 约 2% 即卖
